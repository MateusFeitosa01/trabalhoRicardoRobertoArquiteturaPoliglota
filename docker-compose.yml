services:
  mongodb:
    image: mongo:7
    container_name: nosql_mongo
    ports:
      - "27018:27017" ##! mudei a rota do mongo pois tava dando conflito
    environment:
      MONGO_INITDB_DATABASE: logistica_db
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: nosql_redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  neo4j_local:
    image: neo4j:5-community
    container_name: nosql_neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/senha12345
    volumes:
      - neo4j_data:/data

volumes:
  mongo_data:
  redis_data:
  neo4j_data: